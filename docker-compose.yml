services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GITHUB_USER: ${VITE_GITHUB_USER:-toaandri}
        VITE_GITHUB_TOKEN: ${VITE_GITHUB_TOKEN:-}
    ports:
      - "${PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
